[workspace]
resolver = "2"
members = ["crates/ferrus-core", "crates/ferrus-helper", "crates/ferrus-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Ferrus contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
udev = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
byteorder = "1"
crc32fast = "1"
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
lto = true
strip = true
